name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Dipanggil oleh deploy-frontend.yml supaya deploy hanya jalan kalau CI lolos.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Masih banyak file yang belum diformat Prettier. Setelah sekali jalankan
      # `npm run format` dan commit hasilnya, hapus `continue-on-error` di bawah.
      - name: Format check
        run: npm run format:check
        continue-on-error: true

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          NEXT_TELEMETRY_DISABLED: 1
