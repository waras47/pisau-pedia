name: Deploy Frontend

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Jangan biarkan dua deploy berjalan bersamaan; deploy yang sedang jalan dibiarkan selesai.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1

      - name: Assemble standalone bundle
        run: |
          mkdir -p deploy/.next
          cp -r .next/standalone/. deploy/
          cp -r public deploy/public
          cp -r .next/static deploy/.next/static

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server host key
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync build to server
        run: rsync -avz deploy/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/pisau-pedia/frontend/"

      - name: Restart pm2 process
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/pisau-pedia/frontend && \
             (pm2 reload pisaupedia-frontend --update-env || \
              PORT=3000 pm2 start server.js --name pisaupedia-frontend --cwd /opt/pisau-pedia/frontend) && \
             pm2 save"
